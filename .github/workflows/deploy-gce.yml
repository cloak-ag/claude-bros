name: Deploy claude-bros to GCE

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'server/**'
      - 'templates/**'
      - 'package*.json'
      - 'deploy/**'
      - '.github/workflows/deploy-gce.yml'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'server/**'
      - 'templates/**'
      - 'package*.json'
      - 'deploy/**'
      - '.github/workflows/deploy-gce.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gce-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_ZONE: ${{ vars.GCP_ZONE }}
  GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Test
        run: |
          npm ci
          npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to GCP without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Deploy over IAP
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          gcloud compute ssh "${GCE_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command="set -eu; sudo -u claude-bros git -C /opt/claude-bros fetch origin '${TARGET_SHA}'; sudo -u claude-bros git -C /opt/claude-bros merge --ff-only '${TARGET_SHA}'; test \"\$(sudo -u claude-bros git -C /opt/claude-bros rev-parse HEAD)\" = '${TARGET_SHA}'; sudo -u claude-bros npm --prefix /opt/claude-bros ci --omit=dev; sudo systemctl restart claude-bros; for attempt in \$(seq 1 30); do if curl -fsS http://127.0.0.1:7777/healthz; then exit 0; fi; sleep 1; done; sudo journalctl -u claude-bros --no-pager -n 30; exit 1"

      - name: Summary
        run: |
          echo '## claude-bros deployed to GCE' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authentication: GitHub OIDC (no JSON key)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Administration: IAP SSH' >> "$GITHUB_STEP_SUMMARY"
          echo '- Relay access: public HTTPS through Caddy; token required' >> "$GITHUB_STEP_SUMMARY"
          echo '- State: persistent disk at `/var/lib/claude-bros`' >> "$GITHUB_STEP_SUMMARY"
