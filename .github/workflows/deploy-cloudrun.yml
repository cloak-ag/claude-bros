name: Deploy claude-bros to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'server/**'
      - 'templates/**'
      - 'Dockerfile'
      - 'cloudrun.yaml'
      - '.github/workflows/deploy-cloudrun.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: claude-bros
  REPO: claude-bros

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      # For Cloud Run deploy
      # For Secret Manager access
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Or use workload identity federation:
          # token_format: 'access_token'
          # workload_identity_provider: 'projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          # service_account: 'deploy@my-project.iam.gserviceaccount.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure secret exists
        run: |
          if ! gcloud secrets describe bros-token --project=${{ env.PROJECT_ID }} &>/dev/null; then
            echo "Creating secret bros-token..."
            openssl rand -hex 16 | gcloud secrets create bros-token --data-file=- --project=${{ env.PROJECT_ID }}
          else
            echo "Secret bros-token already exists"
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace cloudrun.yaml \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format=json

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Service deployed to: $URL"

      - name: Post deploy summary
        run: |
          echo "## ✅ claude-bros deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`${{ env.SERVICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps for agents:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Run \`claude-bros join ${{ steps.url.outputs.url }} --as <your-name>\`" >> $GITHUB_STEP_SUMMARY
          echo "2. The token is stored in Secret Manager (bros-token) — join will fetch it from the relay" >> $GITHUB_STEP_SUMMARY
          echo "3. Dashboard: \${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY