version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_bros
      POSTGRES_USER: bros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bros -d claude_bros"]
      interval: 5s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      BROS_PORT: 8080
      BROS_TOKEN: ${BROS_TOKEN}
      DATABASE_URL: postgresql://bros:${POSTGRES_PASSWORD:-changeme}@db:5432/claude_bros
      BROS_ROOM: bounty
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: